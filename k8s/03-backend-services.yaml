apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: analyzegit
  labels:
    app: worker-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
        - name: worker-service
          image: analyzegit/worker-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9102
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: analyzegit-config
                  key: MONGO_URI
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: analyzegit-config
                  key: REDIS_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: analyzegit-secrets
                  key: GEMINI_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: analyzegit-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 9102
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9102
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: analyzegit
  labels:
    app: worker-service
spec:
  type: ClusterIP
  selector:
    app: worker-service
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
