services:
  mongodb:
    image: mongo:6.0
    container_name: analyzegit-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: analyzegit
    volumes:
      - mongo_data:/data/db
    networks:
      - analyzegit-network

  redis:
    image: redis:7-alpine
    container_name: analyzegit-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - analyzegit-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: analyzegit-auth-service
    restart: always
    environment:
      PORT: 5001
      MONGO_URI: ${MONGO_URI:-${MONGODB_URI:-mongodb://mongodb:27017/analyzegit}}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
    depends_on:
      - mongodb
    networks:
      - analyzegit-network

  recruitment-service:
    build:
      context: ./services/recruitment-service
      dockerfile: Dockerfile
    container_name: analyzegit-recruitment-service
    restart: always
    environment:
      PORT: 5003
      MONGO_URI: ${MONGO_URI:-${MONGODB_URI:-mongodb://mongodb:27017/analyzegit}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      - mongodb
      - redis
    networks:
      - analyzegit-network

  analysis-service:
    build:
      context: ./services/analysis-service
      dockerfile: Dockerfile
    container_name: analyzegit-analysis-service
    restart: always
    environment:
      PORT: 5004
      MONGO_URI: ${MONGO_URI:-${MONGODB_URI:-mongodb://mongodb:27017/analyzegit}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey}
    depends_on:
      - mongodb
      - redis
    networks:
      - analyzegit-network

  worker-service:
    build:
      context: ./services/worker-service
      dockerfile: Dockerfile
    container_name: analyzegit-worker-service
    restart: always
    environment:
      MONGO_URI: ${MONGO_URI:-${MONGODB_URI:-mongodb://mongodb:27017/analyzegit}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mongodb
      - redis
    networks:
      - analyzegit-network

  api-gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: analyzegit-api-gateway
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTH_SERVICE_URL: http://auth-service:5001
      RECRUITMENT_SERVICE_URL: http://recruitment-service:5003
      ANALYSIS_SERVICE_URL: http://analysis-service:5004
    depends_on:
      - redis
      - auth-service
      - recruitment-service
      - analysis-service
    networks:
      - analyzegit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analyzegit-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - analyzegit-network

  # --- Monitoring & Observability Stack ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: analyzegit-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - analyzegit-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: analyzegit-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - analyzegit-network

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: analyzegit-node-exporter
    restart: always
    ports:
      - "9100:9100"
    networks:
      - analyzegit-network

networks:
  analyzegit-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
